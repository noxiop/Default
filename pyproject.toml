[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopify-seo-agent"
version = "0.1.0"
description = "Automated Shopify SEO agent using MCP to connect Shopify, GSC, and SEMRush"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
seo-agent = "src.main:cli"
